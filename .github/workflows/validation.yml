name: DeePMD loss schedule validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-loss:
    runs-on: [self-hosted, Windows, X64, deepmd-loss-gpu-dd573a77bf]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      MASK_MACHINE: ${{ secrets.MASK_MACHINE }}
      MASK_USER: ${{ secrets.MASK_USER }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/deepmd-kit
          ref: 7a7a13dfcb8e6c5f653852fcc4b26280f0932952
          path: patched
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepmodeling/deepmd-kit
          ref: 5485b3abccb221a304af5630545e02fd90d272f0
          path: baseline
          persist-credentials: false
      - name: Verify pinned sources and CUDA device
        run: |
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import hashlib,pathlib; pairs=[('patched/deepmd/pt/loss/ener.py', 'ab53defcd3e62119e7ae745011ce6697b9d3fe24718ba0e10b3e2da942c465d8'), ('patched/deepmd/pd/loss/ener.py', 'd16cc56fe047e7af79290e9483c2d18ebca8435d835a2a4b3d35cb57e6cd6e88'), ('patched/deepmd/pt/loss/ener_spin.py', 'c9871b2dd126dac123ef398f2a17cc1b415fa2a9a4ab83f233b72490d93def6d'), ('patched/deepmd/pt/loss/dos.py', 'aadcf0a606d64c9388b4656243e4bceadcba95fda403b54e7de904e1b2650be4'), ('patched/source/tests/pt/test_loss_prefactor_schedule.py', 'a55c6657ffbe320455816d2f743a1fbd2898eaea15628243c82bd4a72678e6ea'), ('patched/source/tests/pd/test_loss_prefactor_schedule_paddle.py', '903412260100bb4d9a13108668b9d277619cc3c473de45e03a64ac87563966e9'), ('baseline/deepmd/pt/loss/ener.py', '8752260710ee00e23aa50116a71a72eb954642ae3a67506bcc1445d7f85a45eb'), ('baseline/deepmd/pd/loss/ener.py', '4eed29551e39b05d6bbda21f377af1dbb5b6fa1032f918ad8a987833604e5b18'), ('baseline/deepmd/pt/loss/ener_spin.py', 'e95c3219e2a4b33be9c5945f59aee8bbe20c6cfb64525de55eb810514aed228f'), ('baseline/deepmd/pt/loss/dos.py', '6b7b61e42bb0d9596bf3bf29d325bbaecb56f557b85cfef1f325ec4777efc274'), ('deepmd_loss_source_runner_20261109.py', 'ed33efa8e3b384df2944e9f9a98763887a1d7f8510919d304648384808f0fe00')]; assert all(hashlib.sha256(pathlib.Path(p).read_bytes().replace(b'\r\n',b'\n')).hexdigest()==h for p,h in pairs); print('Source hashes verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Source hash verification failed' }
          Write-Host 'Patched commit: 7a7a13dfcb8e6c5f653852fcc4b26280f0932952'
          Write-Host 'Upstream baseline: 5485b3abccb221a304af5630545e02fd90d272f0'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' -c "import torch; assert torch.cuda.is_available(); print('GPU:',torch.cuda.get_device_name(0),'PyTorch:',torch.__version__,'CUDA:',torch.version.cuda)"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device check failed' }
      - name: Confirm baseline PyTorch and Paddle failures
        run: |
          $env:DEEPMD_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $env:DEEPMD_TEST_CONFIG = Join-Path $env:RUNNER_TEMP ("deepmd-config-" + $env:GITHUB_RUN_ID)
          $env:DEVICE = 'cuda'
          $pt = Join-Path $env:GITHUB_WORKSPACE 'patched/source/tests/pt/test_loss_prefactor_schedule.py'
          $output = & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' deepmd_loss_source_runner_20261109.py --noconftest --tb=no $pt 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '74 failed, 30 passed') { throw 'Unexpected baseline PyTorch result' }
          $env:DEVICE = 'cpu'
          $pd = Join-Path $env:GITHUB_WORKSPACE 'patched/source/tests/pd/test_loss_prefactor_schedule_paddle.py'
          $output = & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' deepmd_loss_source_runner_20261109.py --noconftest --tb=no $pd 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 1 -or $output -notmatch '26 failed, 10 passed') { throw 'Unexpected baseline Paddle result' }
          exit 0
      - name: Run patched PyTorch CUDA and Paddle CPU tests
        run: |
          $env:DEEPMD_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'patched'
          $env:DEEPMD_TEST_CONFIG = Join-Path $env:RUNNER_TEMP ("deepmd-config-" + $env:GITHUB_RUN_ID)
          $env:DEVICE = 'cuda'
          $pt = Join-Path $env:GITHUB_WORKSPACE 'patched/source/tests/pt/test_loss_prefactor_schedule.py'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' deepmd_loss_source_runner_20261109.py --noconftest --tb=short $pt
          if ($LASTEXITCODE -ne 0) { throw 'Patched PyTorch CUDA tests failed' }
          $env:DEVICE = 'cpu'
          $pd = Join-Path $env:GITHUB_WORKSPACE 'patched/source/tests/pd/test_loss_prefactor_schedule_paddle.py'
          & 'C:\PR\kvpress-gpu-venv-20261107\Scripts\python.exe' deepmd_loss_source_runner_20261109.py --noconftest --tb=short $pd
          if ($LASTEXITCODE -ne 0) { throw 'Patched Paddle CPU tests failed' }

  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DP_ENABLE_PYTORCH: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      UV_HTTP_TIMEOUT: '120'
      NUM_WORKERS: '0'
      DEVICE: cpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/deepmd-kit
          ref: 7a7a13dfcb8e6c5f653852fcc4b26280f0932952
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU backends
        run: |
          python -m pip install uv
          uv pip install --system --group pin_tensorflow_cpu --group pin_pytorch_cpu --torch-backend cpu
      - name: Build the project and install test dependencies
        run: uv pip install --system -e '.[cpu,test,torch]' paddlepaddle==3.3.1
      - name: Check the installed package and run regression tests
        run: |
          dp --version
          python -m pytest -q source/tests/pt/test_loss_prefactor_schedule.py source/tests/pd/test_loss_prefactor_schedule_paddle.py
