name: DeePMD loss schedule validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DP_ENABLE_PYTORCH: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      UV_HTTP_TIMEOUT: '120'
      NUM_WORKERS: '0'
      DEVICE: cpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bingdongni/deepmd-kit
          ref: 252ce46e7aa4ad28fcab6524f12507158d65269e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU backends
        run: |
          python -m pip install uv
          uv pip install --system --group pin_tensorflow_cpu --group pin_pytorch_cpu --torch-backend cpu
      - name: Build the project and install test dependencies
        run: uv pip install --system -e '.[cpu,test,torch]' paddlepaddle==3.3.1
      - name: Check the installed package and run regression tests
        run: |
          dp --version
          python -m pytest -q source/tests/pt/test_loss_prefactor_schedule.py source/tests/pd/test_loss_prefactor_schedule_paddle.py source/tests/common/test_single_frame_repeat.py source/tests/common/test_deepmd_data.py

      - name: Exercise PyTorch and Paddle training
        run: |
          python -m pytest -q source/tests/pt/test_training.py::TestEnergyModelSeA::test_dp_train source/tests/pd/test_training.py::TestEnergyModelSeA::test_dp_train
